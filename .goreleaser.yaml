version: 2

project_name: camsnap

changelog:
  disable: true

builds:
  - id: camsnap
    main: ./cmd/camsnap
    binary: camsnap
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CGO_CFLAGS=-arch arm64
          - CGO_LDFLAGS=-arch arm64
        ldflags:
          - '-s -w -X main.version={{ .Version }} -linkmode external -extldflags "-Wl,-sectcreate,__TEXT,__info_plist,{{ .Env.PWD }}/internal/avf/Info.plist"'
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CGO_CFLAGS=-arch x86_64
          - CGO_LDFLAGS=-arch x86_64
        ldflags:
          - '-s -w -X main.version={{ .Version }} -linkmode external -extldflags "-Wl,-sectcreate,__TEXT,__info_plist,{{ .Env.PWD }}/internal/avf/Info.plist"'
    hooks:
      post:
        - cmd: './scripts/sign-darwin.sh "{{ .Path }}"'
          output: true

archives:
  - ids:
      - camsnap
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
