name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Test
        run: go test ./...

  lint-and-test-macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint with cgo
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: "1"
        with:
          version: latest
          args: --timeout=5m

      - name: Test with cgo
        env:
          CGO_ENABLED: "1"
        run: make test

      - name: Verify macOS deployment targets
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOARCH="$arch" make build
            minos=$(otool -l camsnap | awk '/LC_BUILD_VERSION/ { load = 1 } load && /minos/ { print $2; load = 0 }')
            if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$arch binary requires macOS $minos; expected $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
          done
